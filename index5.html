<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walkman</title>
<style>
:root{--bg:#e9e1d3;--bg2:#d6cbb6;--ink:#2a2a2a;--body1:#ffb81c;--body2:#e8890c;--steel1:#e6e8ea;--steel2:#9aa0a6;--accent:#e63946;--lcd:#1db954}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--bg2:#2c2822;--ink:#eee}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px;
background:radial-gradient(circle at 30% 20%,var(--bg),var(--bg2));color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}
.wm{width:100%;max-width:440px;border-radius:26px;padding:18px 18px 22px;position:relative;
background:linear-gradient(160deg,var(--body1),var(--body2));
box-shadow:0 30px 50px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.6),inset 0 -6px 12px rgba(0,0,0,.25)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.brand{font-weight:900;letter-spacing:.14em;font-size:20px;color:#1b1b1d;font-style:italic}
.brand small{display:block;font-size:9px;letter-spacing:.3em;font-style:normal;font-weight:700;opacity:.7}
.right{display:flex;align-items:center;gap:10px}
.login{border:0;border-radius:6px;padding:7px 10px;font:800 10px "Courier New",monospace;letter-spacing:.06em;background:#1b1b1d;color:var(--lcd);cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led{width:12px;height:12px;border-radius:50%;background:#5a1a1a;box-shadow:inset 0 1px 2px #000;flex:none}
.on .led{background:#ff3b3b;box-shadow:0 0 10px #ff3b3b,inset 0 1px 2px #fff6}
.deck{border-radius:14px;padding:12px;background:linear-gradient(180deg,var(--steel1),var(--steel2));box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.window{background:#0d0d0e;border-radius:10px;padding:12px;box-shadow:inset 0 3px 8px #000;overflow:hidden}
.cass{background:linear-gradient(180deg,#f4efe2,#d9d1bd);border-radius:8px;padding:10px}
.cass.swap{animation:swap 1s ease-in-out}
@keyframes swap{0%{transform:translateY(0)}42%{transform:translateY(-140%)}58%{transform:translateY(140%)}100%{transform:translateY(0)}}
.label{background:#fff;border-radius:4px;padding:5px 8px;font:700 12px/1.25 "Courier New",monospace;color:#222;border-bottom:3px solid var(--accent)}
.label div{display:flex;justify-content:space-between;gap:8px}
.label span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.label small{font-size:10px;font-weight:400;opacity:.7;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reels{display:flex;justify-content:space-around;align-items:center;margin-top:8px;background:#151517;border-radius:30px;padding:8px 6px}
.reel{width:64px;height:64px;animation:spin 2.4s linear infinite;animation-play-state:paused}
.on .reel{animation-play-state:running}
.ff .reel{animation-duration:.5s}
.rw .reel{animation-duration:.5s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.tape{height:6px;flex:1;margin:0 -4px;background:#3a2a1f;border-radius:3px}
.lcd{margin:12px 0 6px;border-radius:8px;background:#0e1a12;padding:8px;box-shadow:inset 0 2px 6px #000;position:relative;min-height:168px}
.lcd iframe{width:100%;height:152px;border:0;border-radius:8px;display:block}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--lcd);font:12px "Courier New",monospace;letter-spacing:.08em;pointer-events:none}
.np{display:none;height:152px;padding:12px;color:var(--lcd);font-family:"Courier New",monospace;flex-direction:column;justify-content:space-between}
.np .row{display:flex;gap:12px;align-items:center}
.np img{width:84px;height:84px;border-radius:4px;background:#0a120d;object-fit:cover;filter:saturate(.8)}
.np b{display:block;font-size:15px;line-height:1.2}
.np span{font-size:12px;opacity:.75}
.bar{height:6px;border-radius:3px;background:#1d3324;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lcd)}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.btn{height:54px;border:0;border-radius:8px 8px 12px 12px;cursor:pointer;font-size:20px;color:#222;
background:linear-gradient(180deg,#f2f2f2,#a9adb2);box-shadow:0 5px 0 #6c7075,0 7px 8px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6c7075}
.btn.play{background:linear-gradient(180deg,#ff6b6b,var(--accent));color:#fff}
.vol.show{display:flex}
.vol{display:none;align-items:center;gap:10px;margin-top:16px;font:800 10px "Courier New",monospace;color:#1b1b1d}
.vol input{flex:1;accent-color:#1b1b1d}
.eject{width:100%;margin-top:14px;height:46px;border:0;border-radius:8px;font:900 13px "Courier New",monospace;letter-spacing:.12em;cursor:pointer;color:#fff;background:#1b1b1d;box-shadow:0 4px 0 #000}
.eject:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.in{display:flex;gap:8px;margin-top:12px}
.in input{flex:1;min-width:0;border:0;border-radius:8px;padding:11px 12px;font-size:16px;background:#fffbe9;color:#222;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.in button{border:0;border-radius:8px;padding:0 14px;font-weight:800;background:#1b1b1d;color:#fff;cursor:pointer}
.tapes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tapes button{border:0;border-radius:4px;padding:6px 9px;font:700 11px "Courier New",monospace;background:#f4efe2;color:#222;cursor:pointer;border-bottom:3px solid var(--accent)}
.st{margin:12px 2px 0;font-size:12px;line-height:1.45;color:#1b1b1d;min-height:1em;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}
.sheet.open{display:flex}
.card{width:100%;max-width:480px;max-height:82vh;max-height:82dvh;display:flex;flex-direction:column;background:#1b1b1d;color:#eee;border-radius:20px 20px 0 0;padding:16px;font-family:"Courier New",monospace}
.card h2{margin:0 0 10px;font-size:14px;letter-spacing:.12em;color:var(--lcd);display:flex;justify-content:space-between}
.card h2 button{background:none;border:0;color:#eee;font-size:18px;cursor:pointer}
.card .tabs{display:flex;gap:6px;margin-bottom:10px}
.card .tabs button{flex:1;border:0;border-radius:6px;padding:8px;font:700 11px "Courier New",monospace;background:#2c2c30;color:#eee;cursor:pointer}
.card .tabs button.a{background:var(--lcd);color:#000}
.card input{width:100%;border:0;border-radius:8px;padding:11px 12px;font-size:16px;background:#fffbe9;color:#222;margin-bottom:10px}
.list{overflow:auto;display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:#2c2c30;border:0;border-radius:8px;padding:8px;color:#eee;text-align:left;cursor:pointer;font-family:inherit;border-left:4px solid var(--accent)}
.item img{width:48px;height:48px;border-radius:3px;object-fit:cover;background:#111;flex:none}
.item b{display:block;font-size:13px}
.item span{font-size:11px;opacity:.7}
.msg{font-size:12px;opacity:.8;line-height:1.5;padding:6px 2px}
</style>
</head>
<body>
<main class="wm" id="wm">
  <div class="top">
    <div class="brand">WALKMAN<small>STEREO CASSETTE PLAYER</small></div>
    <div class="right"><button class="login" id="login">LOGG INN</button><div class="led" title="Strøm"></div></div>
  </div>

  <div class="deck">
    <div class="window">
      <div class="cass" id="cass">
        <div class="label"><div><span id="lt">SIDE A</span><span>C-60</span></div><small id="la">&nbsp;</small></div>
        <div class="reels">
          <svg class="reel" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#2b2b2e"/><circle cx="32" cy="32" r="22" fill="#e9e4d6"/><g stroke="#2b2b2e" stroke-width="5"><path d="M32 12v12M32 40v12M12 32h12M40 32h12"/></g><circle cx="32" cy="32" r="7" fill="#151517"/></svg>
          <div class="tape"></div>
          <svg class="reel" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#2b2b2e"/><circle cx="32" cy="32" r="22" fill="#e9e4d6"/><g stroke="#2b2b2e" stroke-width="5"><path d="M32 12v12M32 40v12M12 32h12M40 32h12"/></g><circle cx="32" cy="32" r="7" fill="#151517"/></svg>
        </div>
      </div>
    </div>
    <div class="lcd">
      <div id="player"></div>
      <div class="np" id="np">
        <div class="row"><img id="npImg" alt=""><div><b id="npT">–</b><span id="npA"></span></div></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
      <div class="empty" id="empty">▮ TRYKK «BYTT KASSETT» ▮</div>
    </div>
  </div>

  <div class="btns">
    <button class="btn" id="rw" aria-label="Forrige">◀◀</button>
    <button class="btn play" id="play" aria-label="Spill / pause">▶</button>
    <button class="btn" id="ffb" aria-label="Neste">▶▶</button>
    <button class="btn" id="stop" aria-label="Stopp">■</button>
  </div>

  <div class="vol">VOL <input type="range" id="vol" min="0" max="100" value="60"></div>

  <button class="eject" id="eject">⏏ BYTT KASSETT</button>

  <p class="st" id="st"></p>
</main>

<div class="sheet" id="sheet">
  <div class="card">
    <h2><span>VELG KASSETT</span><button id="close" aria-label="Lukk">✕</button></h2>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
/* ===== OPPSETT =====
   1. Lag en app på https://developer.spotify.com/dashboard
   2. Legg til Redirect URI: adressen til siden din (f.eks. https://brukernavn.github.io/repo/)
   3. Lim inn Client ID under. */
var CLIENT_ID = '1f456e5915394993b6cbf4ad3cde7828';

(function(){
var $=function(i){return document.getElementById(i)};
var REDIRECT=location.origin+location.pathname;
var SCOPES='streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state user-library-read';
var LS={
  g:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  s:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  d:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
var wm=$('wm'),mode='embed',player=null,deviceId=null,me=null,paused=true,pos=0,dur=0,stamp=0,sdkAck=function(){},IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

function status(t){$('st').textContent=t||''}
function setPlay(on){wm.classList.toggle('on',on);$('play').textContent=on?'❚❚':'▶'}
function burst(c){wm.classList.add(c);setTimeout(function(){wm.classList.remove(c)},1200)}
function setMode(m){mode=m;$('vol').parentNode.classList.toggle('show',m==='sdk'&&!IOS);$('np').style.display=m==='sdk'?'flex':'none';$('player').style.display=m==='sdk'?'none':'block'}

/* ---------- Spotify-innlogging (PKCE, uten backend) ---------- */
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return('0'+b.toString(16)).slice(-2)}).join('')}
async function challenge(v){
  var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return btoa(String.fromCharCode.apply(null,new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function login(){
  if(CLIENT_ID.indexOf('DIN_')===0){status('Legg inn Client ID øverst i index.html først.');return}
  var v=rnd(32);LS.s('wm-v',v);
  var c=await challenge(v);
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code',client_id:CLIENT_ID,scope:SCOPES,redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:c});
}
function logout(){LS.d('wm-tok');location.reload()}
async function tokenReq(p){
  var r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(p)});
  if(!r.ok){var tx=await r.text();throw new Error(r.status+' '+tx.slice(0,140))}
  var d=await r.json(),old=LS.g('wm-tok')||{};
  LS.s('wm-tok',{a:d.access_token,r:d.refresh_token||old.r,e:Date.now()+d.expires_in*1000});
}
async function getToken(){
  var t=LS.g('wm-tok');if(!t)return null;
  if(t.e-60000<Date.now()){
    try{await tokenReq({grant_type:'refresh_token',refresh_token:t.r,client_id:CLIENT_ID});t=LS.g('wm-tok')}
    catch(e){LS.d('wm-tok');return null}
  }
  return t.a;
}
async function api(path,opt){
  var t=await getToken();if(!t)throw new Error('auth');
  opt=opt||{};opt.headers={Authorization:'Bearer '+t,'Content-Type':'application/json'};
  var r=await fetch('https://api.spotify.com/v1'+path,opt);
  if(r.status===204)return null;
  if(!r.ok)throw new Error(r.status);
  return r.json();
}

/* ---------- Avspilling ---------- */
function embed(type,id){
  var p=$('player');p.innerHTML='';
  var f=document.createElement('iframe');
  f.src='https://open.spotify.com/embed/'+type+'/'+id+'?theme=0';
  f.allow='autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
  f.title='Spotify';p.appendChild(f);
  setMode('embed');$('empty').style.display='none';
}
function hist(){return LS.g('wm-hist')||[]}
function addHist(al){
  var h=hist().filter(function(x){return x.id!==al.id});
  var im=al.images&&al.images.length?al.images[Math.min(1,al.images.length-1)]:null;
  h.unshift({id:al.id,name:al.name,artists:al.artists.map(function(a){return{name:a.name}}),images:im?[{url:im.url}]:[]});
  LS.s('wm-hist',h.slice(0,10));
}
function swapLabel(title,artist){
  var c=$('cass');c.classList.remove('swap');void c.offsetWidth;c.classList.add('swap');
  setTimeout(function(){$('lt').textContent=(title||'').toUpperCase();$('la').textContent=artist||'\u00a0'},450);
}
async function loadAlbum(al){
  addHist(al);
  swapLabel(al.name,al.artists.map(function(a){return a.name}).join(', '));
  $('sheet').classList.remove('open');
  LS.s('wm-last',{type:'album',id:al.id,name:al.name,artist:al.artists[0]?al.artists[0].name:''});
  $('empty').style.display='none';
  if(player&&deviceId){
    try{
      if(player.activateElement)player.activateElement();
      var got=false;sdkAck=function(){got=true};status('Starter …');
      await api('/me/player/play?device_id='+deviceId,{method:'PUT',body:JSON.stringify({context_uri:'spotify:album:'+al.id})});
      setTimeout(function(){if(!got){status('Spilleren svarte ikke – bruker innebygd avspiller.');embed('album',al.id);setPlay(true)}else status('')},4000);
      return;
    }catch(e){status('Kunne ikke starte i spilleren ('+e.message+') – bruker innebygd avspiller.')}
  }
  embed('album',al.id);setPlay(true);
}
function initSDK(){
  window.onSpotifyWebPlaybackSDKReady=function(){
    player=new Spotify.Player({name:'Walkman',getOAuthToken:function(cb){getToken().then(cb)},volume:.6});
    player.addListener('ready',function(d){deviceId=d.device_id;status('Walkman er klar – bytt kassett for å spille.')});
    player.addListener('not_ready',function(){deviceId=null});
    ['initialization_error','authentication_error','account_error'].forEach(function(e){
      player.addListener(e,function(m){player=null;deviceId=null;status('Full avspilling er ikke tilgjengelig her ('+e+': '+(m&&m.message?m.message:'')+'). Bruker innebygd avspiller.')});
    });
    player.addListener('player_state_changed',function(s){
      if(!s)return;
      sdkAck();
      var t=s.track_window.current_track;
      $('npT').textContent=t.name;$('npA').textContent=t.artists.map(function(a){return a.name}).join(', ');
      $('npImg').src=t.album.images[0]?t.album.images[0].url:'';
      pos=s.position;dur=s.duration;stamp=Date.now();paused=s.paused;
      if(mode!=='sdk')setMode('sdk');
      setPlay(!s.paused);
    });
    player.connect();
  };
  var s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.body.appendChild(s);
}
setInterval(function(){
  if(mode==='sdk'&&!paused&&dur)$('bar').style.width=Math.min(100,(pos+Date.now()-stamp)/dur*100)+'%';
},500);

/* ---------- Knapper ---------- */
$('play').onclick=function(){
  if(mode==='sdk'&&player){player.togglePlay()}else{setPlay(!wm.classList.contains('on'))}
};
$('stop').onclick=function(){
  if(mode==='sdk'&&player){player.pause();player.seek(0)}
  setPlay(false);
};
$('ffb').onclick=function(){burst('ff');if(mode==='sdk'&&player)player.nextTrack()};
$('rw').onclick=function(){burst('rw');if(mode==='sdk'&&player)player.previousTrack()};
$('vol').oninput=function(){if(player)player.setVolume(this.value/100)};
$('login').onclick=function(){me?logout():login()};

/* ---------- Bytt kassett (albumsøk) ---------- */
var tab='recent',timer;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function renderSheet(){
  var b=$('sheetBody');b.innerHTML='';
  if(!me){
    b.appendChild(el('p','msg','Logg inn med Spotify for å søke etter album og bytte kassett.'));
    var l=el('button','eject','LOGG INN MED SPOTIFY');l.onclick=login;b.appendChild(l);b.appendChild(el('p','msg','SIST SPILT'));var rl=el('div','list');b.appendChild(rl);show(hist(),rl,'Ingen kassetter spilt ennå.');return;
  }
  var tabs=el('div','tabs');
  [['recent','SIST SPILT'],['search','SØK'],['mine','MINE ALBUM']].forEach(function(t){
    var x=el('button',tab===t[0]?'a':'',t[1]);x.onclick=function(){tab=t[0];renderSheet()};tabs.appendChild(x);
  });
  b.appendChild(tabs);
  var list=el('div','list');
  if(tab==='search'){
    var i=el('input');i.placeholder='Søk etter album eller artist …';i.autocomplete='off';
    i.oninput=function(){clearTimeout(timer);timer=setTimeout(function(){search(i.value,list)},350)};
    b.appendChild(i);setTimeout(function(){i.focus()},50);
  }else if(tab==='recent'){
    show(hist(),list,'Ingen kassetter spilt ennå.');
  }else{
    api('/me/albums?limit=30').then(function(d){show(d.items.map(function(x){return x.album}),list)}).catch(function(){list.appendChild(el('p','msg','Kunne ikke hente albumene dine.'))});
  }
  b.appendChild(list);
}
function search(q,list){
  list.innerHTML='';if(!q.trim())return;
  api('/search?type=album&limit=12&q='+encodeURIComponent(q)).then(function(d){show(d.albums.items,list)}).catch(function(){list.appendChild(el('p','msg','Søket feilet.'))});
}
function show(albums,list,none){
  list.innerHTML='';
  if(!albums.length){list.appendChild(el('p','msg',none||'Ingen treff.'));return}
  albums.forEach(function(al){
    var b=el('button','item'),im=el('img');
    var img=al.images[al.images.length>1?1:0];if(img)im.src=img.url;im.alt='';
    var d=el('div');d.appendChild(el('b','',al.name));d.appendChild(el('span','',al.artists.map(function(a){return a.name}).join(', ')));
    b.appendChild(im);b.appendChild(d);b.onclick=function(){loadAlbum(al)};list.appendChild(b);
  });
}
$('eject').onclick=function(){renderSheet();$('sheet').classList.add('open')};
$('close').onclick=function(){$('sheet').classList.remove('open')};
$('sheet').onclick=function(e){if(e.target===this)this.classList.remove('open')};

/* ---------- Oppstart ---------- */
(async function(){
  var p=new URLSearchParams(location.search);
  if(p.get('code')){
    try{await tokenReq({grant_type:'authorization_code',code:p.get('code'),redirect_uri:REDIRECT,client_id:CLIENT_ID,code_verifier:LS.g('wm-v')})}
    catch(e){status('Innloggingen feilet: '+e.message)}
    history.replaceState({},'',location.pathname);
  }
  var l=LS.g('wm-last');
  if(l){$('lt').textContent=(l.name||'').toUpperCase();$('la').textContent=l.artist||'\u00a0';embed(l.type,l.id)}
  if(LS.g('wm-tok')){
    try{
      me=await api('/me');
      $('login').textContent='● '+(me.display_name||'INNLOGGET').toUpperCase();
      $('login').title='Trykk for å logge ut';
      if(IOS)status('På iPhone spilles albumet i Spotifys innebygde avspiller. Trykk play der, og bruk volumknappene på siden av telefonen.');
      else if(me.product==='premium')initSDK();
      else status('Innlogget uten Premium: albumene spilles i den innebygde avspilleren.');
    }catch(e){me=null;status(e.message==='403'?'Spotify nekter tilgang (403). Legg kontoen din til under «User Management» i Spotify-dashbordet, og logg inn på nytt.':'Kunne ikke hente Spotify-profilen ('+e.message+'). Prøv å logge inn på nytt.')}
  }
})();
})();
</script>
</body>
</html>
